<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26區生存之道 - 團隊同步專業版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap');
        
        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff9d;
            --dark-bg: #020617;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--dark-bg);
            color: #f1f5f9;
        }

        .cyber-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .player-row {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .score-font { font-family: 'Orbitron', sans-serif; }

        .input-focus:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        @keyframes pulse-update {
            0% { background-color: rgba(0, 210, 255, 0); }
            50% { background-color: rgba(0, 210, 255, 0.2); }
            100% { background-color: rgba(0, 210, 255, 0); }
        }
        .just-updated { animation: pulse-update 1.5s ease; }
    </style>
</head>
<body class="pb-20">

    <div class="sticky top-0 z-50 cyber-panel p-4 mb-6">
        <div class="max-w-4xl mx-auto">
            <div class="flex flex-col md:flex-row gap-4 items-center">
                
                <div class="flex flex-col w-full md:w-32">
                    <label class="text-[10px] text-blue-400 font-bold mb-1 ml-1 uppercase">玩家編號</label>
                    <input type="number" id="targetId" min="1" max="66" placeholder="1-66"
                           class="bg-slate-900 border-2 border-slate-700 rounded-xl h-14 text-center text-2xl font-bold input-focus">
                </div>

                <div class="flex flex-col w-full md:w-40">
                    <label class="text-[10px] text-green-400 font-bold mb-1 ml-1 uppercase">調整數值</label>
                    <input type="number" id="customVal" placeholder="加/減"
                           class="bg-slate-900 border-2 border-slate-700 rounded-xl h-14 text-center text-xl font-bold input-focus">
                </div>

                <div class="grid grid-cols-4 gap-2 w-full md:flex-1">
                    <button onclick="applyScore(100)" class="h-14 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold border border-slate-600 transition">+100</button>
                    <button onclick="applyScore(500)" class="h-14 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold border border-slate-600 transition">+500</button>
                    <button onclick="applyCustom()" class="h-14 col-span-2 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold shadow-lg shadow-blue-900/20 transition text-lg">執行調整</button>
                </div>

            </div>
            <div id="msgLog" class="text-center text-xs mt-3 h-4 font-medium text-slate-400 transition-all opacity-0"></div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <span id="syncDot" class="flex h-3 w-3 rounded-full bg-green-500"></span>
                即時生存排行榜
            </h2>
            <div class="flex flex-wrap gap-4 text-xs font-bold">
                <button onclick="loadFromGoogleSheet()" class="text-yellow-400 border border-yellow-400/30 px-2 py-1 rounded">🔄 立即刷新</button>
                <button onclick="exportCSV()" class="text-blue-400 hover:underline">導出 CSV</button>
                <button onclick="resetAll()" class="text-red-500 hover:underline">重置所有</button>
            </div>
        </div>

        <div id="boardContainer" class="space-y-3">
            <div class="text-center py-10 text-slate-500 italic">正在連結雲端數據...</div>
        </div>
    </div>

    <script>
        // --- 設定區 ---
        const SCRIPT_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE"; 
        const REFRESH_INTERVAL = 10000; // 每 10 秒自動同步一次

        let players = JSON.parse(localStorage.getItem('evade_v3_data')) || [];

        // --- 雲端同步邏輯 ---

        // 1. 單一玩家增量更新 (防止多人同時修改時互相覆蓋)
        async function syncPlayerToCloud(player) {
            if (!SCRIPT_URL || SCRIPT_URL.includes("YOUR_GOOGLE")) return;
            
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(player)
                });
                notify(`☁️ ${player.name} 已同步`);
            } catch (e) {
                notify("❌ 同步失敗", true);
            }
        }

        // 2. 從雲端抓取全體數據 (自動刷新用)
        async function loadFromGoogleSheet() {
            if (!SCRIPT_URL || SCRIPT_URL.includes("YOUR_GOOGLE")) return;
            
            const dot = document.getElementById('syncDot');
            dot.classList.add('animate-ping'); // 顯示同步中動畫

            try {
                const response = await fetch(SCRIPT_URL);
                const cloudData = await response.json();
                
                if (cloudData && cloudData.length > 0) {
                    // 如果本地沒數據或雲端有新內容，則更新
                    players = cloudData;
                    localStorage.setItem('evade_v3_data', JSON.stringify(players));
                    render();
                }
            } catch (e) {
                console.error("Sync Error", e);
            } finally {
                setTimeout(() => dot.classList.remove('animate-ping'), 1000);
            }
        }

        // --- UI & 操作邏輯 ---

        function notify(text, isError = false) {
            const log = document.getElementById('msgLog');
            log.innerText = text;
            log.className = `text-center text-xs mt-3 h-4 font-medium transition-all opacity-100 ${isError ? 'text-red-400' : 'text-blue-400'}`;
            setTimeout(() => log.classList.add('opacity-0'), 2500);
        }

        function applyScore(val) {
            const idBox = document.getElementById('targetId');
            const id = parseInt(idBox.value);
            const player = players.find(p => p.id === id);

            if (player) {
                player.score += val;
                player.lastUpdate = Date.now();
                
                // 1. 先更新本地 UI (體感極速)
                localStorage.setItem('evade_v3_data', JSON.stringify(players));
                render();
                
                // 2. 非同步推送到雲端 (只傳送受影響的玩家)
                syncPlayerToCloud(player);
                
                idBox.select();
                notify(`✅ ${player.name} 更新成功`);
            } else {
                notify("請輸入正確編號", true);
            }
        }

        function applyCustom() {
            const val = parseInt(document.getElementById('customVal').value);
            if (!isNaN(val)) {
                applyScore(val);
                document.getElementById('customVal').value = "";
            }
        }

        function updateName(id, newName) {
            const player = players.find(p => p.id === id);
            if (player) {
                player.name = newName;
                localStorage.setItem('evade_v3_data', JSON.stringify(players));
                syncPlayerToCloud(player);
            }
        }

        function render() {
            const container = document.getElementById('boardContainer');
            if (players.length === 0) return;

            const sorted = [...players].sort((a, b) => b.score - a.score || a.id - b.id);

            container.innerHTML = sorted.map((p, index) => {
                const rank = index + 1;
                const isRecentlyUpdated = Date.now() - p.lastUpdate < 3000;
                let rankStyle = "text-slate-500";
                if (rank === 1) rankStyle = "text-yellow-400 text-2xl";
                else if (rank === 2) rankStyle = "text-slate-300 text-xl";
                else if (rank === 3) rankStyle = "text-orange-400 text-xl";

                return `
                    <div class="player-row ${isRecentlyUpdated ? 'just-updated' : ''} bg-slate-900/40 border border-slate-800 rounded-2xl p-4 flex items-center gap-4">
                        <div class="score-font font-bold w-10 text-center ${rankStyle}">${rank}</div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded font-mono">ID:${String(p.id).padStart(2, '0')}</span>
                                <input type="text" value="${p.name}" onchange="updateName(${p.id}, this.value)" 
                                       class="bg-transparent border-b border-transparent focus:border-blue-500 focus:outline-none font-bold w-full">
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="score-font text-2xl font-bold ${p.score < 0 ? 'text-red-400' : 'text-blue-400'}">
                                ${p.score.toLocaleString()}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function resetAll() {
            if (confirm("這將重置所有玩家分數。確定嗎？")) {
                players.forEach(p => { 
                    p.score = 0; 
                    p.lastUpdate = Date.now();
                    syncPlayerToCloud(p); // 同步每個重置的玩家
                });
                render();
            }
        }

        function exportCSV() {
            let csv = "排名,ID,姓名,分數\n";
            [...players].sort((a,b)=>b.score-a.score).forEach((p,i)=> csv += `${i+1},${p.id},${p.name},${p.score}\n`);
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "26區生存榜.csv";
            link.click();
        }

        // --- 初始化 ---
        window.onload = () => {
            // 如果本地沒數據，先生成 66 人列表
            if (players.length === 0) {
                players = Array.from({ length: 66 }, (_, i) => ({
                    id: i + 1,
                    name: `玩家 ${String(i + 1).padStart(2, '0')}`,
                    score: 0,
                    lastUpdate: 0
                }));
            }
            render();
            loadFromGoogleSheet(); // 初次載入
            setInterval(loadFromGoogleSheet, REFRESH_INTERVAL); // 啟動自動刷新
        };

        // 快捷鍵
        document.getElementById('targetId').addEventListener('keypress', e => e.key === 'Enter' && applyScore(100));
        document.getElementById('customVal').addEventListener('keypress', e => e.key === 'Enter' && applyCustom());
    </script>
</body>
</html>
